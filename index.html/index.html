<!DOCTYPE html>
<html lang="bn">
<head>
<meta name="google-site-verification" content="b-HUb4VInLZOqySMoTbzEtMUOV2zBO-qVaKEQER-vjk" />  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S7 Pay - User App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #222;
    }

    header {
      background: #075e43;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    .container {
      max-width: 420px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }

    h2 {
      text-align: center;
      color: #075e43;
      margin-top: 0;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      background: #e2e8f0;
      color: #222;
    }

    .tabs button.active {
      background: #075e43;
      color: white;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .submit-btn {
      width: 100%;
      margin-top: 20px;
      background: #075e43;
      color: white;
    }

    .welcome {
      text-align: center;
      line-height: 1.7;
    }

    .notice {
      margin-top: 15px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>S7 Pay</h1>
    <p>Welcome to S7 Pay</p>
  </header>

  <main class="container">

    <section class="card" id="authCard">

      <h2>আপনার অ্যাকাউন্ট</h2>

      <div class="tabs">
        <button
          type="button"
          id="loginTab"
          class="active"
          onclick="showForm('login')">
          Login
        </button>

        <button
          type="button"
          id="registerTab"
          onclick="showForm('register')">
          Register
        </button>
      </div>

      <form id="authForm">

        <div id="nameField" class="hidden">
          <label for="fullName">আপনার নাম</label>
          <input
            id="fullName"
            type="text"
            placeholder="আপনার নাম লিখুন"
            autocomplete="name">
        </div>

        <label for="mobile">ইমেইল</label>
<input
  id="mobile"
  type="email"
  placeholder="আপনার ইমেইল লিখুন"
  autocomplete="email"
  required>

        <label for="password">পাসওয়ার্ড</label>
        <input
          id="password"
          type="password"
          placeholder="পাসওয়ার্ড লিখুন"
          autocomplete="current-password"
          required>

        <button class="submit-btn" id="submitBtn" type="submit">
          Login
        </button>

      </form>

      <p class="notice">
        নিরাপদ অ্যাকাউন্ট ব্যবহারের জন্য নিজের তথ্য গোপন রাখুন।
      </p>

    </section>

    <section class="card welcome hidden" id="welcomeCard">
      <h2>স্বাগতম!</h2>
      <p id="welcomeMessage"></p>
      <p>স্বাগতম! আপনি সফলভাবে লগইন করেছেন।।</p>
      <button
        type="button"
        class="submit-btn"
        onclick="logout()">
        Logout
      </button>
    </section>

  </main>

  <script>
    let currentMode = "login";

    function showForm(mode) {
      currentMode = mode;

      const isRegister = mode === "register";

      document.getElementById("nameField")
        .classList.toggle("hidden", !isRegister);

      document.getElementById("fullName").required = isRegister;

      document.getElementById("loginTab")
        .classList.toggle("active", !isRegister);

      document.getElementById("registerTab")
        .classList.toggle("active", isRegister);

      document.getElementById("submitBtn").textContent =
        isRegister ? "Register" : "Login";

      document.getElementById("password").autocomplete =
        isRegister ? "new-password" : "current-password";
    }

    

    function logout() {
      document.getElementById("welcomeCard")
        .classList.add("hidden");

      document.getElementById("authCard")
        .classList.remove("hidden");
    }
  </script>
<script>
const API_URL = "https://s7-pay-backend.onrender.com";

document.getElementById("authForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const name = document.getElementById("fullName").value.trim();
  const email = document.getElementById("mobile").value.trim();
  const password = document.getElementById("password").value;

  const endpoint = currentMode === "register"
    ? "/api/register"
    : "/api/user/login";

  try {
    const response = await fetch(API_URL + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(
        currentMode === "register"
          ? { name, email, password }
          : { email, password }
      )
    });

    const data = await response.json();
if (currentMode === "login" && data.token) {
  localStorage.setItem("s7_token", data.token);
  }
    if (!response.ok) {
      alert(data.error || "কাজটি সফল হয়নি");
      return;
    }

    alert(data.message || "Login successful");

if (currentMode === "login") {
  document.getElementById("authCard").classList.add("hidden");
  document.getElementById("welcomeCard").classList.remove("hidden");

  document.getElementById("welcomeMessage").textContent =
    


    "স্বাগতম, " + (data.user?.name || data.user?.email || "User") + "!";
}
  } catch (error) {
    alert("Backend-এর সঙ্গে সংযোগ করা যায়নি");
  }
});
  async function openSection(section) {
  const token = localStorage.getItem("s7_token");
  const content = document.getElementById("sectionContent");

  if (!token) {
    alert("আগে Login করুন");
    return;
  }

  content.innerHTML = "Loading...";

  try {
    let response;
    let data;

    if (section === "balance") {
      response = await fetch(API_URL + "/api/user/balance", {
        headers: { Authorization: "Bearer " + token }
      });
      data = await response.json();
      content.innerHTML = "<h3>💰 Balance</h3><p>৳" +
        (data.balance ?? "0") + "</p>";
    } else if (section === "tasks") {
  const taskResponse = await fetch(API_URL + "/api/user/tasks", {
    headers: { Authorization: "Bearer " + token }
  });
  const taskData = await taskResponse.json();

  const settingsResponse = await fetch(API_URL + "/api/payment-settings");
  const settingsData = await settingsResponse.json();
  const settings = settingsData.settings || {};

  content.innerHTML = "<h3>📋 Tasks</h3>" +
    (taskData.tasks || []).map(task =>
      "<p>" + task.title + " — Reward: ৳" + task.reward + "</p>"
    ).join("") +
    "<hr><h3>💳 bKash Payment Details</h3>" +
    "<p>bKash Number: " + (settings.bkash_number || "এখনো সেট করা হয়নি") + "</p>" +
    "<p>Payment Amount: ৳" + (settings.payment_amount || "0") + "</p>" +
    "<p>Instructions: " + (settings.payment_instructions || "কোনো নির্দেশনা নেই") + "</p>";
    } else if (section === "wallet") {
      response = await fetch(API_URL + "/api/user/wallet", {
        headers: { Authorization: "Bearer " + token }
      });
      data = await response.json();
      content.innerHTML = "<h3>👛 Wallet</h3><p>Balance: ৳" +
        (data.balance ?? "0") + "</p>";
    } else if (section === "withdraw") {
      content.innerHTML = `
        <h3>💳 Withdraw</h3>
        <input id="withdrawAmount" type="number" min="1" placeholder="Amount">
        <button onclick="submitWithdraw()">Submit Withdraw</button>
      `;
      return;
    }
        if (section === "tasks") {
      return;
  }
  } catch (error) {
    content.textContent =
      "Error: " + error.message;
    console.error("Tasks/API Error:", error);
  }
}

async function submitWithdraw() {
  const token = localStorage.getItem("s7_token");
  const amount = Number(document.getElementById("withdrawAmount").value);
  const content = document.getElementById("sectionContent");

  if (!amount || amount <= 0) {
    alert("সঠিক Amount দিন");
    return;
  }

  try {
    const response = await fetch(API_URL + "/api/user/withdraw", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + token
      },
      body: JSON.stringify({ amount })
    });

    const data = await response.json();
    alert(data.message || data.error || "Request সম্পন্ন হয়নি");
    if (response.ok) openSection("wallet");
  } catch (error) {
    alert("সার্ভারের সঙ্গে সংযোগ করা যায়নি");
  }
}
</script>
  <style>
.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}
.dash-box {
  background: #075e43;
  color: white;
  padding: 20px 10px;
  border-radius: 12px;
  text-align: center;
}
.dash-box h3 {
  margin: 0 0 10px;
}
</style>

<div class="dashboard">
  <button class="dash-box" onclick="openSection('balance')">
    💰 Balance
  </button>

  <button class="dash-box" onclick="openSection('tasks')">
    📋 Tasks
  </button>

  <button class="dash-box" onclick="openSection('withdraw')">
    💳 Withdraw
  </button>

  <button class="dash-box" onclick="openSection('wallet')">
    👛 Wallet
  </button>
</div>

<div id="sectionContent"></div>
  </body>
</html>
